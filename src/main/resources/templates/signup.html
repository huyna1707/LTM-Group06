<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký - Professional Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }

        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .input-focus:focus {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .btn-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.4);
        }

        .floating-shapes {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            animation: float 6s ease-in-out infinite;
        }

        .shape:nth-child(1) {
            width: 80px;
            height: 80px;
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }

        .shape:nth-child(2) {
            width: 120px;
            height: 120px;
            top: 60%;
            right: 10%;
            animation-delay: 2s;
        }

        .shape:nth-child(3) {
            width: 60px;
            height: 60px;
            bottom: 20%;
            left: 20%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        .slide-in {
            animation: slideIn 0.8s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .password-strength {
            height: 4px;
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        .strength-weak { background-color: #ef4444; width: 33%; }
        .strength-medium { background-color: #f59e0b; width: 66%; }
        .strength-strong { background-color: #10b981; width: 100%; }

        .error-message {
            color: #ef4444;
            font-size: 0.875rem;
            margin-top: 0.25rem;
        }

        .success-message {
            color: #10b981;
            font-size: 0.875rem;
            margin-top: 0.25rem;
        }
    </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-4 relative">
<!-- Floating Background Shapes -->
<div class="floating-shapes">
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
</div>

<!-- Registration Card -->
<div class="glass-effect rounded-3xl shadow-2xl p-8 w-full max-w-lg relative z-10 slide-in">
    <!-- Header -->
    <div class="text-center mb-8">
        <div class="w-16 h-16 bg-gradient-to-r from-green-500 to-blue-600 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg">
            <i class="fas fa-user-plus text-white text-2xl"></i>
        </div>
        <h1 class="text-3xl font-bold text-gray-800 mb-2">Tạo tài khoản mới</h1>
        <p class="text-gray-600">Điền thông tin để bắt đầu</p>
    </div>

    <!-- Registration Form -->
    <form method="POST" th:action="@{/signup}" class="space-y-6" th:object="${user}">
        <!-- Username -->
        <div class="relative">
            <label class="block text-sm font-medium text-gray-700 mb-2">Tên đăng nhập</label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <i class="fas fa-user text-gray-400"></i>
                </div>
                <input
                        type="text"
                        id="username"
                        required
                        class="input-focus w-full pl-10 pr-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-300 bg-white/80"
                        placeholder="Chọn tên đăng nhập"
                        onblur="validateUsername()" th:field="*{username}"
                >
                <div id="usernameError" class="error-message hidden"></div>
                <div id="usernameSuccess" class="success-message hidden"></div>
            </div>
        </div>

        <!-- Password -->
        <div class="relative">
            <label class="block text-sm font-medium text-gray-700 mb-2">Mật khẩu</label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <i class="fas fa-lock text-gray-400"></i>
                </div>
                <input
                        type="password"
                        id="password"
                        required
                        class="input-focus w-full pl-10 pr-12 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-300 bg-white/80"
                        placeholder="Tạo mật khẩu mạnh"
                        oninput="checkPasswordStrength()" th:field="*{password}"
                >
                <button
                        type="button"
                        onclick="togglePassword('password', 'toggleIcon1')"
                        class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 transition-colors"
                >
                    <i class="fas fa-eye" id="toggleIcon1"></i>
                </button>
            </div>
            <!-- Password Strength Indicator -->
            <div class="mt-2">
                <div class="bg-gray-200 rounded-full h-1">
                    <div id="passwordStrength" class="password-strength"></div>
                </div>
                <div id="passwordStrengthText" class="text-xs text-gray-500 mt-1"></div>
            </div>
        </div>

        <!-- Confirm Password -->
        <div class="relative">
            <label class="block text-sm font-medium text-gray-700 mb-2">Xác nhận mật khẩu</label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <i class="fas fa-lock text-gray-400"></i>
                </div>
                <input
                        type="password"
                        id="confirmPassword"
                        required
                        class="input-focus w-full pl-10 pr-12 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-300 bg-white/80"
                        placeholder="Nhập lại mật khẩu"
                        onblur="validatePasswordMatch()"
                >
                <button
                        type="button"
                        onclick="togglePassword('confirmPassword', 'toggleIcon2')"
                        class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 transition-colors"
                >
                    <i class="fas fa-eye" id="toggleIcon2"></i>
                </button>
            </div>
            <div id="confirmPasswordError" class="error-message hidden"></div>
            <div id="confirmPasswordSuccess" class="success-message hidden"></div>
        </div>

        <!-- Terms and Conditions -->
        <div class="flex items-start space-x-3">
            <input
                    type="checkbox"
                    id="terms"
                    required
                    class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500 mt-1"
            >
            <label for="terms" class="text-sm text-gray-600 leading-relaxed">
                Tôi đồng ý với
                <a href="#" class="text-blue-600 hover:text-blue-800 font-medium">Điều khoản sử dụng</a>
                và
                <a href="#" class="text-blue-600 hover:text-blue-800 font-medium">Chính sách bảo mật</a>
            </label>
        </div>

        <!-- Register Button -->
        <button
                type="submit"
                id="registerBtn"
                class="btn-hover w-full bg-gradient-to-r from-green-500 to-blue-600 text-white font-semibold py-3 px-6 rounded-xl transition-all duration-300 flex items-center justify-center space-x-2 shadow-lg"
        >
            <span>Tạo tài khoản</span>
            <i class="fas fa-user-plus"></i>
        </button>
    </form>

    <!-- Divider -->
    <div class="my-6 flex items-center">
        <div class="flex-1 border-t border-gray-300"></div>
        <span class="px-4 text-sm text-gray-500">hoặc</span>
        <div class="flex-1 border-t border-gray-300"></div>
    </div>

    <!-- Social Registration -->
    <div class="space-y-3">
        <button class="w-full flex items-center justify-center space-x-2 bg-white border border-gray-300 rounded-xl py-3 px-4 hover:bg-gray-50 transition-colors shadow-sm">
            <i class="fab fa-google text-red-500"></i>
            <span class="text-gray-700 font-medium">Đăng ký với Google</span>
        </button>
        <button class="w-full flex items-center justify-center space-x-2 bg-blue-600 text-white rounded-xl py-3 px-4 hover:bg-blue-700 transition-colors shadow-sm">
            <i class="fab fa-facebook-f"></i>
            <span class="font-medium">Đăng ký với Facebook</span>
        </button>
    </div>

    <!-- Login Link -->
    <div class="mt-8 text-center">
        <p class="text-gray-600">
            Đã có tài khoản?
            <a href="/login" class="text-blue-600 hover:text-blue-800 font-semibold transition-colors">
                Đăng nhập ngay
            </a>
        </p>
    </div>
</div>

<script>
    function togglePassword(inputId, iconId) {
        const passwordInput = document.getElementById(inputId);
        const toggleIcon = document.getElementById(iconId);

        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            toggleIcon.classList.remove('fa-eye');
            toggleIcon.classList.add('fa-eye-slash');
        } else {
            passwordInput.type = 'password';
            toggleIcon.classList.remove('fa-eye-slash');
            toggleIcon.classList.add('fa-eye');
        }
    }

    function validateUsername() {
        const username = document.getElementById('username').value;
        const errorDiv = document.getElementById('usernameError');
        const successDiv = document.getElementById('usernameSuccess');

        if (username.length < 3) {
            errorDiv.textContent = 'Tên đăng nhập phải có ít nhất 3 ký tự';
            errorDiv.classList.remove('hidden');
            successDiv.classList.add('hidden');
            return false;
        } else if (!/^[a-zA-Z0-9_]+$/.test(username)) {
            errorDiv.textContent = 'Tên đăng nhập chỉ được chứa chữ, số và dấu gạch dưới';
            errorDiv.classList.remove('hidden');
            successDiv.classList.add('hidden');
            return false;
        } else {
            errorDiv.classList.add('hidden');
            successDiv.textContent = 'Tên đăng nhập khả dụng';
            successDiv.classList.remove('hidden');
            return true;
        }
    }

    function checkPasswordStrength() {
        const password = document.getElementById('password').value;
        const strengthBar = document.getElementById('passwordStrength');
        const strengthText = document.getElementById('passwordStrengthText');

        let strength = 0;
        let feedback = '';

        if (password.length >= 8) strength++;
        if (/[a-z]/.test(password)) strength++;
        if (/[A-Z]/.test(password)) strength++;
        if (/[0-9]/.test(password)) strength++;
        if (/[^A-Za-z0-9]/.test(password)) strength++;

        strengthBar.className = 'password-strength';

        if (strength < 3) {
            strengthBar.classList.add('strength-weak');
            feedback = 'Mật khẩu yếu';
        } else if (strength < 5) {
            strengthBar.classList.add('strength-medium');
            feedback = 'Mật khẩu trung bình';
        } else {
            strengthBar.classList.add('strength-strong');
            feedback = 'Mật khẩu mạnh';
        }

        strengthText.textContent = feedback;
    }

    function validatePasswordMatch() {
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const errorDiv = document.getElementById('confirmPasswordError');
        const successDiv = document.getElementById('confirmPasswordSuccess');

        if (password !== confirmPassword) {
            errorDiv.textContent = 'Mật khẩu xác nhận không khớp';
            errorDiv.classList.remove('hidden');
            successDiv.classList.add('hidden');
            return false;
        } else {
            errorDiv.classList.add('hidden');
            successDiv.textContent = 'Mật khẩu khớp';
            successDiv.classList.remove('hidden');
            return true;
        }
    }

    function handleRegistration(event) {
        event.preventDefault();

        // Validate all fields
        const isValid = validateUsername() &&
            validatePasswordMatch();

        if (!isValid) {
            alert('Vui lòng kiểm tra lại thông tin!');
            return;
        }

        // Loading effect
        const button = document.getElementById('registerBtn');
        const originalContent = button.innerHTML;

        button.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Đang tạo tài khoản...';
        button.disabled = true;

        // Simulate registration process
        setTimeout(() => {
            alert('Đăng ký thành công!');
            button.innerHTML = originalContent;
            button.disabled = false;

            // Reset form
            event.target.reset();
            document.querySelectorAll('.success-message, .error-message').forEach(el => {
                el.classList.add('hidden');
            });
            document.getElementById('passwordStrength').className = 'password-strength';
            document.getElementById('passwordStrengthText').textContent = '';
        }, 3000);
    }

    // Add focus effects
    document.querySelectorAll('input').forEach(input => {
        input.addEventListener('focus', function() {
            this.parentElement.classList.add('scale-105');
        });

        input.addEventListener('blur', function() {
            this.parentElement.classList.remove('scale-105');
        });
    });
</script>

</html>
